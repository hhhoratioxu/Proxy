  - "heads4-ak-spotify-com.akamaized.net"
  - "spotify.com.edgesuite.net"
  - "spotify.map.fastly.net"
  - "spotify.map.fastlylb.net"

domain_suffix_set:
  - "byspotify.com"
  - "lifeatspotify.com"
  - "pscdn.co"
  - "scdn.co"
  - "spoti.fi"
  - "spotify-com.akamaized.net"
  - "spotify-everywhere.com"
  - "spotify.app.link"
  - "spotify.com"
  - "spotify.design"
  - "spotify.link"
  - "spotifycdn.com"
  - "spotifycdn.net"
  - "spotifycharts.com"
  - "spotifycodes.com"
