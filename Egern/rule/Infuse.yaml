# NAME: Infuse
# AUTHOR: Horatio
# FORMAT: Egern YAML rule_set
# FORMAT-VERIFIED: 2026-10-25
# RULES: 13
# SOURCE: Loon/rule/Infuse.lsr (same repository)
# USE: reference this URL from a rule_set with an assigned policy.
# PROVENANCE / EXISTING NOTES:
# SOURCE: Firecore/Infuse services + TMDB + Trakt + OpenSubtitles + observed Infuse sync endpoint + Horatio custom media domains
# NOTE: TMDB is Infuse's current primary online metadata source.

domain_set:
  - "infuse-sync.s3-accelerate.amazonaws.com"

domain_suffix_set:
  - "firecore.com"
  - "infuse.im"
  - "ncdn1.sntp.uk"
  - "opensubtitles.com"
  - "opensubtitles.org"
  - "post.cn2gias.uk"
  - "pre.cn2gias.uk"
  - "precdns.cn2gias.uk"
  - "sub1.sntp.me"
  - "themoviedb.org"
  - "tmdb.org"
  - "trakt.tv"
