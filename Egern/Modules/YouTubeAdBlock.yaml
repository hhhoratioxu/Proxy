name: "YouTube AdBlock 2026 for Egern"
description: "基于 Maasea 2026-07 新版 Onesie/UMP 链路：config/log_event 获取加密密钥，initplayback 经 Worker 处理，response 清理广告并隐藏上传/Shorts。请保持 Egern Block QUIC 开启。"
author: "Maasea / Horatio"
homepage: "https://github.com/Maasea/sgmodule"
category: "YouTube"

rules:
  - and:
      match:
        - domain_suffix:
            match: "googlevideo.com"
        - protocol:
            match: "UDP"
      policy: "REJECT"
  - and:
      match:
        - domain:
            match: "youtubei.googleapis.com"
        - protocol:
            match: "UDP"
      policy: "REJECT"

scriptings:
  - http_response:
      name: "YouTube 2026 Response"
      match: "^https:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/(browse|next|player|search|reel\\/reel_watch_sequence|guide|account\\/get_setting|get_watch|log_event|config)(\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js"
      env:
        _compat.$argument: '{"captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true,"debug":false}'
      body_required: true
      binary_body: true
      max_size: -1
      timeout: 60

  - http_request:
      name: "YouTube 2026 InitPlayback"
      match: "^https?:\\/\\/[\\w-]+\\.googlevideo\\.com\\/initplayback.+&ack.*$"
      script_url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js"
      env:
        _compat.$argument: '{"captionLang":"off","blockUpload":true,"blockImmersive":true,"blockShorts":true}'
      body_required: true
      binary_body: true
      max_size: -1
      timeout: 60

  - http_request:
      name: "YouTube 2026 LogEvent"
      match: "^https:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/log_event(\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js"
      body_required: true
      binary_body: true
      max_size: -1
      timeout: 60

mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "youtubei.googleapis.com"
