name: "YouTube AdBlock for Egern"
description: "YouTube / YouTube Music 去广告。播放页广告直接拦截 rr*.googlevideo.com/initplayback，界面广告由 Maasea 响应脚本处理；同时拒绝 YouTube QUIC/UDP，避免绕过 MITM。"
author: "fmz200 / Maasea / Horatio"
homepage: "https://github.com/fmz200/wool_scripts"
category: "YouTube"

rules:
  - and:
      match:
        - domain_suffix:
            match: "googlevideo.com"
        - protocol:
            match: "udp"
      policy: "REJECT"
  - and:
      match:
        - domain:
            match: "youtubei.googleapis.com"
        - protocol:
            match: "udp"
      policy: "REJECT"

map_locals:
  - match: "^https:\\/\\/rr[\\w-]+\\.googlevideo\\.com\\/initplayback\\?"
    status_code: 200
    body: "{}"
    headers:
      Content-Type: "application/json"

scriptings:
  - http_response:
      name: "YouTube AdBlock Response"
      match: "^https:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/(browse|next|player|search|reel\\/reel_watch_sequence|guide|account\\/get_setting|get_watch)(\\?.*)?$"
      script_url: "https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js"
      body_required: true
      binary_body: true
      timeout: 60

mitm:
  hostnames:
    includes:
      - "rr*.googlevideo.com"
      - "youtubei.googleapis.com"
