name: "YouTube AdBlock for Egern"
description: "YouTube / YouTube Music 去广告。覆盖 ctier=L、oad、pagead、ptracking、广告统计接口，并清理 player/get_watch 等响应中的广告结构。与独立 DualSubs 翻译模块配合使用。"
author: "Aioneas / Maasea / Horatio"
homepage: "https://github.com/Aioneas/Surge"
category: "YouTube"

rules:
  - and:
      match:
        - domain_suffix:
            match: "googlevideo.com"
        - protocol:
            match: "udp"
      policy: "REJECT"
  - and:
      match:
        - domain:
            match: "youtubei.googleapis.com"
        - protocol:
            match: "udp"
      policy: "REJECT"

url_rewrites:
  - match: "(^https?:\\/\\/[\\w-]+\\.googlevideo\\.com\\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+)"
    location: "$1$2$3"
    status_code: 302

map_locals:
  - match: "^https?:\\/\\/[\\w-]+\\.googlevideo\\.com\\/(?!(dclk_video_ads|videoplayback\\?)).+&oad"
    status_code: 200
    body: " "
  - match: "^https?:\\/\\/(www|s)\\.youtube\\.com\\/api\\/stats\\/ads"
    status_code: 200
    body: " "
  - match: "^https?:\\/\\/(www|s)\\.youtube\\.com\\/(pagead|ptracking)"
    status_code: 200
    body: " "
  - match: "^https?:\\/\\/s\\.youtube\\.com\\/api\\/stats\\/qoe\\?adcontext"
    status_code: 200
    body: " "

scriptings:
  - http_response:
      name: "YouTube AdBlock Response"
      match: "^https?:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/(browse|next|player|search|reel\\/reel_watch_sequence|guide|account\\/get_setting|get_watch)"
      script_url: "https://raw.githubusercontent.com/Aioneas/Surge/main/Script/youtube.response.js"
      arguments:
        _compat.$argument: '{"lyricLang":"off","captionLang":"off","blockUpload":true,"blockImmersive":false,"blockShorts":false,"debug":false}'
      max_size: -1
      timeout: 60
      body_required: true
      binary_body: true

mitm:
  hostnames:
    includes:
      - "*.googlevideo.com"
      - "www.youtube.com"
      - "s.youtube.com"
      - "youtubei.googleapis.com"
    excludes:
      - "redirector*.googlevideo.com"
