name: "Streaming Unlock"
description: "Egern 原生流媒体解锁查询：检测当前分流或指定策略的 Netflix、Disney+、YouTube Premium、Prime Video、Spotify、Max、Paramount+、Peacock、BBC iPlayer、Abema、Bahamut Anime 与 KKTV。"
author: "Horatio Xu"
homepage: "https://github.com/hhhoratioxu/Proxy"
manual: "https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Modules/StreamingUnlock.md"

compat_arguments:
  POLICY: ""
  TIMEOUT: "8000"

scriptings:
  - generic:
      name: "Streaming Unlock"
      script_url: "https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/Scripts/StreamingUnlock.js"
      env:
        POLICY: "{{{POLICY}}}"
        TIMEOUT: "{{{TIMEOUT}}}"
      update_interval: 3600
      timeout: 60
      disabled: false

widgets:
  - name: "Streaming Unlock"
    script_name: "Streaming Unlock"
