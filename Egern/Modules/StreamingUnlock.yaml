name: "Streaming Unlock"
description: "Egern 原生流媒体解锁查询：每项检测自动遵循你现有的 Egern Rules / Rule Set / Policy，不使用统一代理策略。支持 Netflix、Disney+、YouTube Premium、Prime Video、Spotify、Max、Paramount+、Peacock、BBC iPlayer、Abema、Bahamut Anime 与 KKTV，并显示 Apple / AI / Spotify 分流地区自检。"
author: "Horatio Xu"
homepage: "https://github.com/hhhoratioxu/Proxy"
manual: "https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Modules/StreamingUnlock.md"

compat_arguments:
  TIMEOUT: "8000"

scriptings:
  - generic:
      name: "Streaming Unlock"
      script_url: "https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/Scripts/StreamingUnlock.js"
      env:
        TIMEOUT: "{{{TIMEOUT}}}"
      update_interval: 3600
      timeout: 60
      disabled: false

widgets:
  - name: "Streaming Unlock"
    script_name: "Streaming Unlock"
