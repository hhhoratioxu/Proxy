# Horatio YouTube Clean 1.2.8; native ESM runtime.
name: YouTube Clean 1.2.8
author: Horatio Xu
icon: captions.bubble.fill
homepage: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeClean.md
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeClean.md
description: 减少正文复制与重复解析；去广告、字幕翻译及底栏独立开关。需 HTTPS 解密。
env_schema:
  REMOVE_ADS:
    name: 去广告
    default_value: "true"
    options: ["true", "false"]
  TRANSLATE_CAPTIONS:
    name: 字幕翻译
    default_value: "true"
    options: ["true", "false"]
  TARGET_LANGUAGE:
    name: 翻译语言
    default_value: "zh-Hans"
    options: ["zh-Hans", "zh-Hant", "en", "ja", "ko"]
  FALLBACK_TRANSLATION:
    name: Google 备用翻译
    default_value: "true"
    options: ["true", "false"]
  BILINGUAL:
    name: 原文与译文双语
    default_value: "true"
    options: ["true", "false"]
  AUTO_CAPTIONS:
    name: 优先原生字幕轨道
    default_value: "true"
    options: ["true", "false"]
  HIDE_UPLOAD:
    name: 隐藏底部发布＋
    default_value: "true"
    options: ["true", "false"]
  HIDE_SHORTS:
    name: 隐藏底部 Shorts
    default_value: "false"
    options: ["true", "false"]
  DEEP_FILTER:
    name: 深层广告与推广过滤
    default_value: "true"
    options: ["true", "false"]
  DIAGNOSTICS:
    name: 输出结构诊断日志
    default_value: "true"
    options: ["true", "false"]
mitm:
  hostnames:
    - "youtubei.googleapis.com"
    - "youtubei-att.googleapis.com"
    - "www.youtube.com"
    - "m.youtube.com"
    - "*.googlevideo.com"
scriptings:
  - http_request:
      name: YouTube Clean · 底栏与播放配置刷新
      match: "^https://(?:youtubei(?:-att)?\\.googleapis\\.com|(?:www|m)\\.youtube\\.com)(?::443)?/youtubei/v1/(?:browse|guide|log_event)(?:\\?.*)?$"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/5fd57ddda63380d5c9c608ae2f26b6becb97dc12/Egern/script/YouTubeClean.js
      body_required: false
      timeout: 8
      update_interval: 86400
  - http_response:
      name: YouTube Clean · 广告字幕与底栏
      match: "(?:^https://(?:youtubei(?:-att)?\\.googleapis\\.com|(?:www|m)\\.youtube\\.com)(?::443)?/youtubei/v1/(?:player(?:/ad_break)?|browse|next|search|guide|navigation/resolve_url|reel/(?:reel_watch_sequence|reel_item_watch)|get_watch|config|log_event)(?:\\?.*)?$|^https://(?:www|m)\\.youtube\\.com(?::443)?/api/timedtext(?:\\?.*)?$|^https://[a-zA-Z0-9-]+\\.googlevideo\\.com(?::443)?/initplayback(?:\\?.*)?$)"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/5fd57ddda63380d5c9c608ae2f26b6becb97dc12/Egern/script/YouTubeClean.js
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 8
      update_interval: 86400
