# Horatio YouTube Clean 1.0.0; native ESM runtime.
name: YouTube Clean · 去广告与双语字幕
author: Horatio Xu
icon: captions.bubble.fill
homepage: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeClean.md
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeClean.md
description: 1.0.0 · 独立重写，发布＋与 Shorts 底栏分别可选隐藏。需 HTTPS 解密；真机效果待验收。
env_schema:
  REMOVE_ADS:
    name: 去广告
    default_value: "true"
    options: ["true", "false"]
  TRANSLATE_CAPTIONS:
    name: 字幕翻译
    default_value: "true"
    options: ["true", "false"]
  TARGET_LANGUAGE:
    name: 翻译语言
    default_value: "zh-Hans"
    options: ["zh-Hans", "zh-Hant", "en", "ja", "ko"]
  BILINGUAL:
    name: 原文与译文双语
    default_value: "true"
    options: ["true", "false"]
  AUTO_CAPTIONS:
    name: 优先选择翻译字幕
    default_value: "true"
    options: ["true", "false"]
  HIDE_UPLOAD:
    name: 隐藏底部发布＋
    default_value: "true"
    options: ["true", "false"]
  HIDE_SHORTS:
    name: 隐藏底部 Shorts
    default_value: "false"
    options: ["true", "false"]
mitm:
  hostnames:
    - "youtubei.googleapis.com"
    - "youtubei-att.googleapis.com"
    - "www.youtube.com"
    - "m.youtube.com"
    - "*.googlevideo.com"
scriptings:
  - http_request:
      name: YouTube Clean · 底栏与播放配置刷新
      match: "^https://(?:youtubei(?:-att)?\\.googleapis\\.com|(?:www|m)\\.youtube\\.com)/youtubei/v1/(?:guide|log_event)(?:\\?.*)?$"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/749d68f4530323f924b3bd7a9cf1bc272d4bfeff/Egern/script/YouTubeClean.js
      body_required: false
      timeout: 8
      update_interval: 86400
  - http_response:
      name: YouTube Clean · 广告字幕与底栏
      match: "(?:^https://(?:youtubei(?:-att)?\\.googleapis\\.com|(?:www|m)\\.youtube\\.com)/youtubei/v1/(?:player(?:/ad_break)?|browse|next|search|guide|navigation/resolve_url|reel/(?:reel_watch_sequence|reel_item_watch)|get_watch|config|log_event)(?:\\?.*)?$|^https://(?:www|m)\\.youtube\\.com/api/timedtext(?:\\?.*)?$|^https://[a-zA-Z0-9-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$)"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/749d68f4530323f924b3bd7a9cf1bc272d4bfeff/Egern/script/YouTubeClean.js
      body_required: true
      binary_body: true
      max_size: 8388608
      timeout: 8
      update_interval: 86400
