# VerseLyrics 0.3.3 — Egern 原生模块，2026-10-15
# 本地交付版：先在 Egern「工具 → 脚本」保存 spotify-lyrics.js。
# script_url 为 Egern 本地脚本文件名，不是电脑的绝对路径。
name: Spotify 双语歌词 · VerseLyrics
author: Horatio Xu
icon: music.note.list
description: 开启翻译后以插件译文替换全部官方译文，保留原生排版和原词；无词时严格匹配备用源。需 HTTPS 解密。
env_schema:
  TRANSLATION_ENABLED:
    name: 开启歌词翻译
    description: 默认关闭；开启后用 Google 网页接口译文替换全部 Spotify 官方译文，仅保留所选目标语言。失败时显示原词，不回退到官方译文；由 Spotify 原生界面显示。
    default_value: 'false'
    options: ['true', 'false']
  TARGET_LANGUAGE:
    name: 翻译目标语言
    description: zh-CN 简体中文，zh-TW 繁体中文，en 英语，ja 日语，ko 韩语；其他为标准语言代码。
    default_value: zh-CN
    options: [zh-CN, zh-TW, en, ja, ko, fr, de, es, pt, it, ru, ar, hi, id, vi, th, tr, nl, pl, sv, uk, he, fa, ms, el]
  FALLBACK_PROVIDER:
    name: 无词时的备用源
    description: auto 依次 LRCLIB、QQ 音乐、网易云；off 不补源。始终优先 Spotify 原词，指定一家仅影响无词后的选择。
    default_value: auto
    options: [auto, lrclib, qq, netease, 'off']
  DISCOVER_MISSING:
    name: 尝试显示原本无歌词的歌曲
    description: 默认开启；立即补入原生歌词入口，不等待联网查词。实际无词请求再严格匹配备用源；未收录的歌曲仍可能无词。
    default_value: 'true'
    options: ['true', 'false']
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_request:
      name: VerseLyrics · 歌词请求缓存处理
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/(?:color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\s]+)?/?|metadata/4/track/[0-9a-f]{32}|extended-metadata/v0/extended-metadata/?|scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?)(?:\?.*)?$'
      script_url: spotify-lyrics.js
      body_required: false
      timeout: 3
  - http_response:
      name: VerseLyrics · Spotify 原词与翻译
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\s]+)?/?(?:\?.*)?$'
      script_url: spotify-lyrics.js
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 歌曲信息与无词补源
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/metadata/4/track/[0-9a-f]{32}(?:\?.*)?$'
      script_url: spotify-lyrics.js
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 批量歌曲信息与无词补源
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/extended-metadata/v0/extended-metadata/?(?:\?.*)?$'
      script_url: spotify-lyrics.js
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 原生歌词卡片补全
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?(?:\?.*)?$'
      script_url: spotify-lyrics.js
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 25
  - generic:
      name: VerseLyrics · 最近处理状态
      script_url: spotify-lyrics.js
      timeout: 3
