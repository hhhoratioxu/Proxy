# VerseLyrics 0.3.1 — Egern 原生模块，2026-10-15
# 仓库分发版：远程导入此模块，Egern 自动获取同仓库的原创脚本。
# 离线使用请导入同目录 SpotifyLyrics.local.yaml。
name: Spotify 双语歌词 · VerseLyrics
author: Horatio Xu
homepage: https://github.com/hhhoratioxu/Proxy/tree/main/Egern/script/SpotifyLyrics
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/script/SpotifyLyrics/README.md
icon: music.note.list
description: 向 Spotify 原生翻译字段提供独立译文；原词优先，明确无词才按严格元数据匹配备用源。需 HTTPS 解密；尚待真机验收。
env_schema:
  TRANSLATION_ENABLED:
    name: 开启歌词翻译
    description: 默认关闭；开启后歌词文本会发送给 Google 翻译网页接口，由 Spotify 原生翻译界面控制排版和开关；保留原词，不发送 Spotify 令牌。
    default_value: 'false'
    options: ['true', 'false']
  TARGET_LANGUAGE:
    name: 翻译目标语言
    description: zh-CN 简体中文，zh-TW 繁体中文，en 英语，ja 日语，ko 韩语；其他为标准语言代码。
    default_value: zh-CN
    options: [zh-CN, zh-TW, en, ja, ko, fr, de, es, pt, it, ru, ar, hi, id, vi, th, tr, nl, pl, sv, uk, he, fa, ms, el]
  FALLBACK_PROVIDER:
    name: 无词时的备用源
    description: auto 依次 LRCLIB、QQ 音乐、网易云；off 不补源。始终优先 Spotify 原词，指定一家仅影响无词后的选择。
    default_value: auto
    options: [auto, lrclib, qq, netease, 'off']
  DISCOVER_MISSING:
    name: 尝试显示原本无歌词的歌曲
    description: 默认开启；确认有原词或严格匹配的备用歌词后补充原生歌词卡片，并支持批量元数据。旧模块保存的 false 需手动改为 true；不保证所有歌曲有备用词。
    default_value: 'true'
    options: ['true', 'false']
mitm:
  hostnames:
    - spclient.wg.spotify.com
    - '*-spclient.spotify.com'
scriptings:
  - http_request:
      name: VerseLyrics · 歌词请求缓存处理
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/(?:color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\s]+)?/?|metadata/4/track/[0-9a-f]{32}|extended-metadata/v0/extended-metadata/?|scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?)(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      body_required: false
      timeout: 3
  - http_response:
      name: VerseLyrics · Spotify 原词与翻译
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\s]+)?/?(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      body_required: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 歌曲信息与无词补源
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/metadata/4/track/[0-9a-f]{32}(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      body_required: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 批量歌曲信息与无词补源
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/extended-metadata/v0/extended-metadata/?(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      body_required: true
      max_size: 2097152
      timeout: 25
  - http_response:
      name: VerseLyrics · 原生歌词卡片补全
      match: '^https://(?:spclient\.wg|[a-z0-9-]+-spclient)\.spotify\.com(?::443)?/scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      body_required: true
      max_size: 2097152
      timeout: 25
  - generic:
      name: VerseLyrics · 最近处理状态
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/main/Egern/script/SpotifyLyrics/spotify-lyrics.js
      timeout: 3
