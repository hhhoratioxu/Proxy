# 0.1.0 · 一个模块同时处理去广告和双语字幕；运行脚本固定版本。
name: YouTube 去广告与双语字幕
author: Horatio Xu
icon: captions.bubble.fill
homepage: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeAdTranslate.md
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/YouTubeAdTranslate.md
description: 默认去广告与原文＋简体中文双语字幕；需 HTTPS 解密，真实 App 效果待真机验收。
env_schema:
  ADBLOCK_ENABLED:
    name: 去广告
    default_value: "true"
    options: ["true","false"]
  TRANSLATION_ENABLED:
    name: 字幕翻译
    default_value: "true"
    options: ["true","false"]
  TARGET_LANGUAGE:
    name: 翻译目标语言
    default_value: "zh-Hans"
    options: ["zh-Hans","zh-Hant","en","ja","ko"]
  BILINGUAL:
    name: 显示原文与译文
    default_value: "true"
    options: ["true","false"]
  AUTO_CC:
    name: 优先选择翻译字幕轨道
    default_value: "true"
    options: ["true","false"]
mitm:
  hostnames:
    - "youtubei.googleapis.com"
    - "youtubei-att.googleapis.com"
    - "www.youtube.com"
    - "m.youtube.com"
    - "*.googlevideo.com"
scriptings:
- http_request:
    name: YouTubeAdTranslate · 密钥配置刷新
    match: "^https://youtubei(?:-att)?\\.googleapis\\.com/youtubei/v1/log_event(?:\\?.*)?$"
    script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/28ac3725fe8e753a666c92625b2c308042d32150/Egern/script/YouTubeAdTranslate.js
    body_required: false
    timeout: 12
    update_interval: 86400
- http_response:
    name: YouTubeAdTranslate · 广告与字幕
    match: "(?:^https://(?:youtubei(?:-att)?\\.googleapis\\.com|(?:www|m)\\.youtube\\.com)/youtubei/v1/(?:browse|next|player|search|reel/reel_watch_sequence|get_watch|log_event|config)(?:\\?.*)?$|^https://[a-zA-Z0-9-]+\\.googlevideo\\.com/initplayback(?:\\?.*)?$|^https://(?:www|m)\\.youtube\\.com/api/timedtext(?:\\?.*)?$)"
    script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/28ac3725fe8e753a666c92625b2c308042d32150/Egern/script/YouTubeAdTranslate.js
    body_required: true
    binary_body: true
    max_size: 8388608
    timeout: 12
    update_interval: 86400
