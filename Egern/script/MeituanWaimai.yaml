# 美团外卖去广告 v0.2.0 · Egern 原生模块
# 2026-10-20 · 广告接口、素材与开屏配置缓存处理
name: 美团外卖去广告
description: v0.2.0 · 开屏广告和已知广告素材；首页推广与红包弹窗仍需实测。
author: Horatio Xu
homepage: https://github.com/hhhoratioxu/Proxy
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/MeituanWaimai.md
mitm:
  hostnames:
    - "wmapi.meituan.com"
    - "img.meituan.net"
    - "p*.meituan.net"
    - "s3plus.meituan.net"
    - "flowplus.meituan.net"
scriptings:
  - http_request:
      name: 美团外卖 · 广告拦截与配置刷新
      match: "(?:^https?:\\/\\/wmapi\\.meituan\\.com(?::(?:80|443))?\\/api\\/v[0-9]+\\/loadInfo\\/?(?:\\?[^#]*)?$)|(?:^https?:\\/\\/wmapi\\.meituan\\.com(?::(?:80|443))?\\/api\\/v[0-9]+\\/(?:startpicture\\/?(?:\\?[^#]*)?|openscreen\\/?\\?(?:[^&#]*&)*ad[A-Za-z0-9_]*(?:=[^&#]*)?(?:&[^#]*)?)$)|(?:^https?:\\/\\/img\\.meituan\\.net(?::(?:80|443))?\\/bizad\\/bizad_brandCpt_[0-9]+\\.jpg(?:@[^/?#]+)?(?:\\?[^#]*)?$)|(?:^https?:\\/\\/p[0-9]+\\.meituan\\.net(?::(?:80|443))?\\/(?:bizad|brandCpt)\\/[A-Za-z0-9_-]+\\.jpg(?:@[^/?#]+)?(?:\\?[^#]*)?$)|(?:^https?:\\/\\/(?:s3plus|flowplus)\\.meituan\\.net(?::(?:80|443))?\\/v[0-9]+\\/[A-Za-z0-9_-]+\\/linglong\\/[A-Za-z0-9_-]+\\.(?:gif|jpg)(?:@[^/?#]+)?(?:\\?[^#]*)?$)|(?:^https?:\\/\\/(?:s3plus|flowplus)\\.meituan\\.net(?::(?:80|443))?\\/v[0-9]+\\/[A-Za-z0-9_-]+\\/linglong\\/[A-Za-z0-9_-]+\\.mp4(?:\\?[^#]*)?$)|(?:^https?:\\/\\/s3plus\\.meituan\\.net(?::(?:80|443))?\\/v[0-9]+\\/mss_[A-Za-z0-9_-]+\\/brandcpt-vedio\\/[A-Za-z0-9_-]+\\.(?:zip|mp4)(?:\\?[^#]*)?$)"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/0ab4530cf4c96408e4d81f5896a6d694a49be571/Egern/script/MeituanWaimai.js
      body_required: false
      timeout: 8
      update_interval: 86400
  - http_response:
      name: 美团外卖 · 开屏配置清理
      match: "^https?:\\/\\/wmapi\\.meituan\\.com(?::(?:80|443))?\\/api\\/v[0-9]+\\/loadInfo\\/?(?:\\?[^#]*)?$"
      script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/0ab4530cf4c96408e4d81f5896a6d694a49be571/Egern/script/MeituanWaimai.js
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 8
      update_interval: 86400
