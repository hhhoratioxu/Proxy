# VerseLyrics 0.7.1 — silent production module; no notification or scheduled scripts.
name: Spotify 双语歌词 · VerseLyrics
author: Horatio Xu
icon: music.note.list
homepage: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/script/SpotifyLyrics.yaml
manual: https://github.com/hhhoratioxu/Proxy/blob/main/Egern/Docs/SpotifyLyrics.md
description: 核心 0.7.1 · 适配 12。减少官方歌词翻译时的无用缓存解析，优化批量元数据写入；新增可选补词时间校正。 保留补词、翻译与原生高亮。需 HTTPS 解密。
env_schema:
  FALLBACK_OFFSET_MS:
    name: 补词时间校正（毫秒）
    description: 仅影响所有备用来源的逐行同步歌词。正数延后、负数提前，默认 0；不影响官方原词，无时间轴歌词不移动。
    default_value: "0"
    options:
    - "0"
    - "-500"
    - "-1000"
    - "-2000"
    - "-5000"
    - "500"
    - "1000"
    - "2000"
    - "5000"
  FETCH_ARTWORK_COLOR:
    name: 联网获取专辑配色
    description: 关闭可省去额外取色请求；已有配色仍可复用，否则使用中性灰，补词和翻译保留。
    default_value: "true"
    options:
    - "true"
    - "false"
  MEMORY_MODE:
    name: 缓存容量
    description: standard 为 128 条和 64000 字符；compact 为 64 条和 32000 字符，旧歌更早淘汰，较长记录可能不缓存。
    default_value: "standard"
    options:
    - "standard"
    - "compact"
  PREFERRED_SOURCE:
    name: 优先歌词源
    description: 仅 auto 补词模式生效；优先尝试所选来源，其他来源继续兜底，已有成功缓存优先。
    default_value: "auto"
    options:
    - "auto"
    - "lrclib"
    - "qq"
    - "netease"
    - "kugou"
    - "kuwo"
    - "lyricsovh"
  TRANSLATION_ENABLED:
    name: 开启歌词翻译
    description: 默认开启；以插件译文替换 Spotify 官方译文，保留原词与原生歌词排版。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  SOURCE_TRANSLATIONS:
    name: 复用歌词源译文
    description: 简体中文目标下采用同次补词响应中精确对齐的中文译文，其余行继续翻译；关闭则全部使用翻译服务。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  TARGET_LANGUAGE:
    name: 翻译目标语言
    description: zh-CN 简体中文，zh-TW 繁体中文，en 英语，ja 日语，ko 韩语；其他为标准语言代码。
    default_value: zh-CN
    options:
    - zh-CN
    - zh-TW
    - en
    - ja
    - ko
    - fr
    - de
    - es
    - pt
    - it
    - ru
    - ar
    - hi
    - id
    - vi
    - th
    - tr
    - nl
    - pl
    - sv
    - uk
    - he
    - fa
    - ms
    - el
  FALLBACK_PROVIDER:
    name: 无词时的备用源
    description: auto 按六源顺序查询，优先同歌手近期成功的同步源；off 不补源。始终优先 Spotify 原词，指定一家仅影响无词后的选择。
    default_value: auto
    options:
    - auto
    - lrclib
    - qq
    - netease
    - kugou
    - kuwo
    - lyricsovh
    - 'off'
  DISCOVER_MISSING:
    name: 尝试显示原本无歌词的歌曲
    description: 默认开启；自动处理客户端歌词检查、歌曲有词标记与原生歌词卡片，无词时匹配备用来源。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
mitm:
  hostnames:
  - spclient.wg.spotify.com
  - "*-spclient.spotify.com"
scriptings:
- http_request:
    script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/fd3a0400d50488f23160d42a3d2369e47d216ba3/Egern/script/SpotifyLyrics/spotify-lyrics-request.js?v=0.7.1
    env:
      TRANSLATION_ENABLED: 'true'
      TARGET_LANGUAGE: zh-CN
      FALLBACK_PROVIDER: auto
      DISCOVER_MISSING: 'true'
      SOURCE_TRANSLATIONS: 'true'
      FALLBACK_OFFSET_MS: "0"
      FETCH_ARTWORK_COLOR: "true"
      MEMORY_MODE: "standard"
      PREFERRED_SOURCE: "auto"
    update_interval: 3600
    name: VerseLyrics · 请求处理
    match: "^https://(?:spclient\\.wg|[a-z0-9-]+-spclient)\\.spotify\\.com(?::443)?/(?:color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\\s]+)?/?|metadata/4/track/[0-9a-f]{32}|extended-metadata/v0/extended-metadata/?|scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?|user-customization-service/v1/customize/?|bootstrap/v1/bootstrap/?|v1/customize/?|context-resolve/v1/spotify(?::|%3[aA])[^?#\\s/]{1,512}/?|connect-state/v1/devices/[0-9A-Za-z_-]{16,128}/?)(?:\\?.*)?$"
    body_required: false
    timeout: 3
- http_response:
    script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/fd3a0400d50488f23160d42a3d2369e47d216ba3/Egern/script/SpotifyLyrics/spotify-lyrics.js?v=0.7.1
    env:
      TRANSLATION_ENABLED: 'true'
      TARGET_LANGUAGE: zh-CN
      FALLBACK_PROVIDER: auto
      DISCOVER_MISSING: 'true'
      SOURCE_TRANSLATIONS: 'true'
      FALLBACK_OFFSET_MS: "0"
      FETCH_ARTWORK_COLOR: "true"
      MEMORY_MODE: "standard"
      PREFERRED_SOURCE: "auto"
    update_interval: 3600
    name: VerseLyrics · 歌词
    match: "^https://(?:spclient\\.wg|[a-z0-9-]+-spclient)\\.spotify\\.com(?::443)?/color-lyrics/v2/track/[0-9A-Za-z]{22}(?:/image/[^?#\\s]+)?/?(?:\\?.*)?$"
    body_required: true
    binary_body: true
    max_size: 262144
    timeout: 12
- http_response:
    script_url: https://raw.githubusercontent.com/hhhoratioxu/Proxy/fd3a0400d50488f23160d42a3d2369e47d216ba3/Egern/script/SpotifyLyrics/spotify-lyrics-entry.js?v=0.7.1
    env:
      TRANSLATION_ENABLED: 'true'
      TARGET_LANGUAGE: zh-CN
      FALLBACK_PROVIDER: auto
      DISCOVER_MISSING: 'true'
      SOURCE_TRANSLATIONS: 'true'
      FALLBACK_OFFSET_MS: "0"
      FETCH_ARTWORK_COLOR: "true"
      MEMORY_MODE: "standard"
      PREFERRED_SOURCE: "auto"
    update_interval: 3600
    name: VerseLyrics · 入口
    match: "^https://(?:spclient\\.wg|[a-z0-9-]+-spclient)\\.spotify\\.com(?::443)?/(?:metadata/4/track/[0-9a-f]{32}|extended-metadata/v0/extended-metadata/?|scrollsita/v1/scroll/spotify(?::|%3[aA])track(?::|%3[aA])[0-9A-Za-z]{22}/?|user-customization-service/v1/customize/?|bootstrap/v1/bootstrap/?|v1/customize/?|context-resolve/v1/spotify(?::|%3[aA])[^?#\\s/]+/?|connect-state/v1/devices/[0-9A-Za-z_-]{16}[0-9A-Za-z_-]*/?)(?:\\?.*)?$"
    body_required: true
    binary_body: true
    max_size: 131072
    timeout: 3
