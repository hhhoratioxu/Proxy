# NAME: Spotify
# AUTHOR: Horatio
# FORMAT: Egern Remote Rule Set
# UPDATED: 2026-09-21
# TOTAL: 32
#
# Covers Spotify app/web, APIs, audio/media CDN, short links,
# marketing/corporate domains and known Spotify delivery endpoints.
#
# Sources cross-checked against blackmatrix7/ios_rule_script,
# Repcz/Tool and v2fly/domain-list-community.
#
# Use this URL as an Egern rule_set match and select the desired policy
# in your main Egern configuration. All conditions in this file are OR-matched.
#
# no_resolve prevents IP rules from forcing extra DNS resolution.

no_resolve: true

domain_set:
