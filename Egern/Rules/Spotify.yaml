  - byspotify.com
  - lifeatspotify.com
  - pscdn.co
  - scdn.co
  - spoti.fi
  - spotify-com.akamaized.net
  - spotify-everywhere.com
  - spotify.app.link
  - spotify.com
  - spotify.design
  - spotify.link
  - spotifycdn.com
  - spotifycdn.net
  - spotifycharts.com
  - spotifycodes.com
  - spotifyforbrands.com
  - spotifyforvendors.com
  - spotifyjobs.com
  - spotifynewsroom.jp
  - spotilocal.com
  - tospotify.com

ip_cidr_set:
  - 35.186.224.47/32

user_agent_set:
  - 'Spotify*'
