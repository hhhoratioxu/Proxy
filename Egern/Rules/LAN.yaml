# NAME: LAN
# AUTHOR: Horatio
# FORMAT: Egern Remote Rule Set
# UPDATED: 2026-09-20
# TOTAL: 16
#
# Local/private/reserved network destinations.
# Mirrors the local-network bypass ranges used in the Loon configuration.
# Recommended policy: DIRECT
#
# Note: A rule_set controls routing after traffic reaches Egern.
# For traffic that should bypass Egern's tunnel entirely, keep the
# corresponding ranges in bypass_tunnel_proxy as well.

no_resolve: true

domain_set:
  - localhost

domain_suffix_set:
  - local
  - lan

ip_cidr_set:
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 255.255.255.255/32
