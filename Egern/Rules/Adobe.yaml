  - pre-signed-firefly-prod.s3-accelerate.amazonaws.com
  - pre-signed-firefly-prod.s3.amazonaws.com
  - aep-cs-blobstore-prod-va6-data.s3.amazonaws.com
  - dnzuu5synxxfk.cloudfront.net

