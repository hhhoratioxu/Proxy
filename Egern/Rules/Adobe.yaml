# NAME: Adobe
# AUTHOR: Horatio
# FORMAT: Egern Remote Rule Set
# UPDATED: 2026-09-20
# TOTAL: 73
#
# Covers Adobe Creative Cloud, Acrobat, Firefly, Adobe Express, Behance,
# Adobe Fonts/Typekit, Adobe Stock, Adobe Sign, Experience Cloud,
# Marketo, Magento/Adobe Commerce and related Adobe infrastructure.
#
# Based primarily on Adobe's official network endpoint documentation,
# updated 2026-09-03. Broad third-party roots such as certificate vendors,
# social platforms and generic cloud providers are intentionally excluded
# to avoid routing unrelated traffic through the Adobe policy.
#
# Use this URL as an Egern rule_set match and select the desired policy
# in your main Egern configuration. All conditions in this file are OR-matched.

