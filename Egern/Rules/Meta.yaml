# NAME: Meta
# AUTHOR: Horatio
# FORMAT: Egern Remote Rule Set
# UPDATED: 2026-09-22
# TOTAL: 75
#
# Meta family all-in-one rule set.
# Covers Meta core services and first-party infrastructure, including:
# Facebook, Messenger, Instagram, Threads, WhatsApp, Meta AI,
# Meta Horizon / Quest / Oculus, Meta Pay, Free Basics and legacy Workplace.
#
# The list intentionally excludes obvious typo/squatted third-party domains
# found in some legacy community lists to avoid accidental over-matching.
# AS32934 is included to cover Meta-owned network infrastructure and direct-IP traffic.
#
# Sources cross-checked against Meta's current technologies pages,
# v2fly/domain-list-community and Repcz Egern rules.
#
# Use this URL as an Egern rule_set match and select the desired policy
# in your main Egern configuration. All conditions in this file are OR-matched.

