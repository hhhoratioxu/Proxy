# NAME: Wikimedia
# AUTHOR: Horatio
# FORMAT: Egern Remote Rule Set
# UPDATED: 2026-09-20
# TOTAL: 22
#
# Covers Wikimedia Foundation projects and related infrastructure:
# Wikipedia, Wikimedia Commons, Wikidata, Wikifunctions, Wikispecies,
# Wiktionary, Wikibooks, Wikiquote, Wikisource, Wikiversity,
# Wikivoyage, Wikinews, MediaWiki, Toolforge and Wikimedia Cloud.
#
# WikiLeaks is intentionally excluded because it is not a Wikimedia project.
#
# Use this URL as an Egern rule_set match and select the desired policy
# in your main Egern configuration. All conditions in this file are OR-matched.

domain_suffix_set:
  - mediawiki.org
  - toolforge.org
  - w.wiki
  - wikibooks.org
  - wikidata.org
  - wikifunctions.org
  - wikimedia.com
  - wikimedia.org
  - wikimediacloud.org
  - wikimediafoundation.org
  - wikinews.org
  - wikipedia.com
  - wikipedia.org
  - wikiquote.org
  - wikisource.org
  - wikispecies.org
  - wikiversity.org
  - wikivoyage.org
  - wiktionary.org
  - wmcloud.org
  - wmflabs.org
  - wmfusercontent.org
