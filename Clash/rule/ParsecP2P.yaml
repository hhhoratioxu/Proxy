# NAME: ParsecP2P
# AUTHOR: Horatio Xu
# FORMAT: Mihomo classical YAML rule-provider
# FORMAT-VERIFIED: 2026-10-25
# RULES: 5
# POLICY: DIRECT when importing; place before Parsec proxy rule set.
# COMPAT: Process detection must be enabled; SRC-PORT fallback may match unrelated UDP connections.
# WARNING: These rules cannot guarantee a P2P connection through CGNAT or restrictive firewalls.

payload:
  - 'DOMAIN,stun.parsec.app'
  - 'DOMAIN,stun6.parsec.app'
  - 'AND,((PROCESS-NAME,parsecd),(NETWORK,udp))'
  - 'AND,((PROCESS-NAME,parsecd.exe),(NETWORK,udp))'
  - 'AND,((SRC-PORT,9000),(NETWORK,udp))'
