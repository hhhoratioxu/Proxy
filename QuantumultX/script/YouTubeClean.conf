#!name = YouTube Clean 1.2.11
#!desc = 降低主页解析与嵌套正文复制开销；去广告、字幕翻译与底栏开关。需 HTTPS 解密。
#!author = Horatio Xu
#!homepage = https://github.com/hhhoratioxu/Proxy/blob/main/QuantumultX/Docs/YouTubeClean.md
# Quantumult X build 934+；在「重写 → 引用」添加此地址。
# 设置在脚本地址 # 后；修改 HIDE_UPLOAD / HIDE_SHORTS 时同步更新下面两行。
hostname = youtubei.googleapis.com, youtubei-att.googleapis.com, www.youtube.com, m.youtube.com, *.googlevideo.com
^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)(?::443)?/youtubei/v1/(?:browse|guide|log_event)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/hhhoratioxu/Proxy/6dd4f61ae35043ddc2299b8ea28c9b0c29f46bb8/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&FALLBACK_TRANSLATION=true&BILINGUAL=true&CAPTION_LAYOUT=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false&DEEP_FILTER=true&DIAGNOSTICS=true
(?:^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)(?::443)?/youtubei/v1/(?:player(?:/ad_break)?|browse|next|search|guide|navigation/resolve_url|reel/(?:reel_watch_sequence|reel_item_watch)|get_watch|config|log_event)(?:\?.*)?$|^https://(?:www|m)\.youtube\.com(?::443)?/api/timedtext(?:\?.*)?$|^https://[a-zA-Z0-9-]+\.googlevideo\.com(?::443)?/initplayback(?:\?.*)?$) url script-response-body https://raw.githubusercontent.com/hhhoratioxu/Proxy/6dd4f61ae35043ddc2299b8ea28c9b0c29f46bb8/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&FALLBACK_TRANSLATION=true&BILINGUAL=true&CAPTION_LAYOUT=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false&DEEP_FILTER=true&DIAGNOSTICS=true
