#!name = YouTube Clean · 去广告与双语字幕
#!desc = 1.0.0 · 独立重写，发布＋与 Shorts 底栏分别可选隐藏。需 HTTPS 解密；真机效果待验收。
#!author = Horatio Xu
#!homepage = https://github.com/hhhoratioxu/Proxy/blob/main/QuantumultX/Docs/YouTubeClean.md
# Quantumult X build 934+；在「重写 → 引用」添加此地址。
# 设置在脚本地址 # 后；修改 HIDE_UPLOAD / HIDE_SHORTS 时同步更新下面两行。
hostname = youtubei.googleapis.com, youtubei-att.googleapis.com, www.youtube.com, m.youtube.com, *.googlevideo.com
^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)/youtubei/v1/(?:guide|log_event)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/hhhoratioxu/Proxy/749d68f4530323f924b3bd7a9cf1bc272d4bfeff/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false
(?:^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)/youtubei/v1/(?:player(?:/ad_break)?|browse|next|search|guide|navigation/resolve_url|reel/(?:reel_watch_sequence|reel_item_watch)|get_watch|config|log_event)(?:\?.*)?$|^https://(?:www|m)\.youtube\.com/api/timedtext(?:\?.*)?$|^https://[a-zA-Z0-9-]+\.googlevideo\.com/initplayback(?:\?.*)?$) url script-response-body https://raw.githubusercontent.com/hhhoratioxu/Proxy/749d68f4530323f924b3bd7a9cf1bc272d4bfeff/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false
