# Quantumult X build 934+；在「重写 → 引用」添加此地址。
# 设置在脚本地址 # 后；修改 HIDE_UPLOAD / HIDE_SHORTS 时同步更新下面两行。
hostname = youtubei.googleapis.com, youtubei-att.googleapis.com, www.youtube.com, m.youtube.com, *.googlevideo.com
^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)(?::443)?/youtubei/v1/(?:browse|guide|log_event)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/hhhoratioxu/Proxy/7ff5135483b285a5b2a3156142a09d67ab0d8b5e/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false&DEEP_FILTER=false&DIAGNOSTICS=true
(?:^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)(?::443)?/youtubei/v1/(?:player(?:/ad_break)?|browse|next|search|guide|navigation/resolve_url|reel/(?:reel_watch_sequence|reel_item_watch)|get_watch|config|log_event)(?:\?.*)?$|^https://(?:www|m)\.youtube\.com(?::443)?/api/timedtext(?:\?.*)?$|^https://[a-zA-Z0-9-]+\.googlevideo\.com(?::443)?/initplayback(?:\?.*)?$) url script-response-body https://raw.githubusercontent.com/hhhoratioxu/Proxy/7ff5135483b285a5b2a3156142a09d67ab0d8b5e/QuantumultX/script/YouTubeClean.js#REMOVE_ADS=true&TRANSLATE_CAPTIONS=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CAPTIONS=true&HIDE_UPLOAD=true&HIDE_SHORTS=false&DEEP_FILTER=false&DIAGNOSTICS=true
