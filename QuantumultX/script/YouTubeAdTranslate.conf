#!name = YouTube 去广告与双语字幕
#!desc = 0.1.0 · 默认原文＋简体中文；需 HTTPS 解密，实际效果待真机验收。
#!author = Horatio Xu
#!homepage = https://github.com/hhhoratioxu/Proxy/blob/main/QuantumultX/Docs/YouTubeAdTranslate.md
# Quantumult X build 934+；在「重写 → 引用」添加此地址。
# 设置从脚本地址的 # 参数传入；修改时同步更新下面两条。
hostname = youtubei.googleapis.com, youtubei-att.googleapis.com, www.youtube.com, m.youtube.com, *.googlevideo.com
^https://youtubei(?:-att)?\.googleapis\.com/youtubei/v1/log_event(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/hhhoratioxu/Proxy/28ac3725fe8e753a666c92625b2c308042d32150/QuantumultX/script/YouTubeAdTranslate.js#ADBLOCK_ENABLED=true&TRANSLATION_ENABLED=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CC=true
(?:^https://(?:youtubei(?:-att)?\.googleapis\.com|(?:www|m)\.youtube\.com)/youtubei/v1/(?:browse|next|player|search|reel/reel_watch_sequence|get_watch|log_event|config)(?:\?.*)?$|^https://[a-zA-Z0-9-]+\.googlevideo\.com/initplayback(?:\?.*)?$|^https://(?:www|m)\.youtube\.com/api/timedtext(?:\?.*)?$) url script-response-body https://raw.githubusercontent.com/hhhoratioxu/Proxy/28ac3725fe8e753a666c92625b2c308042d32150/QuantumultX/script/YouTubeAdTranslate.js#ADBLOCK_ENABLED=true&TRANSLATION_ENABLED=true&TARGET_LANGUAGE=zh-Hans&BILINGUAL=true&AUTO_CC=true
